name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests, data, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # Verifies the manifest against the binary geometry: buffer extents and
      # alignment, index ranges, normal lengths, bounds containment, concept
      # membership, and the recorded fingerprint of the shipped atlas.
      - name: Validate anatomy data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          {
            echo '### Bundle'
            echo
            echo '| file | bytes |'
            echo '| --- | ---: |'
            find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -printf '| %f | %s |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
